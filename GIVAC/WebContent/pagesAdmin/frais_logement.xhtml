<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui">
<ui:composition template="/templates/templateAdministrateur.xhtml">
	<ui:define name="body">
		<h:form id="form">
			<h1 class="page-title">PARAMETRAGE DES FRAIS TYPES LOGEMENTS</h1>
			<p:messages autoUpdate="true" closable="true" showDetail="true" />
			<div class="widget-content">

							<h:panelGrid id="type_logement_grid" columns="2" cellpadding="6">

								<p:outputLabel for="cb_type_logement" value="Type Logement" />
								<p:selectOneMenu id="cb_type_logement" required="true"
									value="#{fraisLogementBean.choosedTypeLogement}"
									converter="#{entityConverter}">
									<f:selectItem itemLabel="Selectionnez" itemValue="" />
									<f:selectItems value="#{fraisLogementBean.listTypeLogement}" var="tata"
									itemLabel="#{tata.libtypeLogement}" itemValue="#{tata}"></f:selectItems>
								</p:selectOneMenu>								
							</h:panelGrid>
						
						<legend>Nationaux</legend>
						
							<h:panelGrid id="lognfrais_grid" columns="4" cellpadding="6">
							<p:outputLabel for="log_nat" value="Montant logement:" />
							<p:inputText id="log_nat" value="#{fraisLogementBean.typeLogementNation.montantTypeLogement}" styleClass="upercase" required="true">
							<p:ajax event="blur" update="@this" />
							<f:convertNumber pattern="##,###.###"></f:convertNumber>
							</p:inputText>
							
							
							<p:outputLabel for="caut_nat" value="Montant Caution:" />
							<p:inputText id="caut_nat" value="#{fraisLogementBean.typeLogementNation.cautionTypeLogement}" styleClass="upercase" required="true">
							<p:ajax event="blur" update="@this" />
							<f:convertNumber pattern="##,###.###"></f:convertNumber>
							</p:inputText>
							</h:panelGrid>
						
					
						<legend>Non nationaux</legend>
						
							<h:panelGrid id="lognnfrais_grid" columns="4" cellpadding="6">
							
							<p:outputLabel for="log_nonnat" value="Montant logement:"/>
							<p:inputText id="log_nonnat" value="#{fraisLogementBean.typeLogementNonNation.montantTypeLogement}" styleClass="upercase" required="true">
							<p:ajax event="blur" update="@this" />
							<f:convertNumber pattern="##,###.###"></f:convertNumber>
							</p:inputText>		
									
							
							<p:outputLabel for="caut_nonnat" value="Montant caution:"/>
							<p:inputText id="caut_nonnat" value="#{fraisLogementBean.typeLogementNonNation.cautionTypeLogement}" styleClass="upercase" required="true">
							<p:ajax event="blur" update="@this" />
							<f:convertNumber pattern="##,###.###"></f:convertNumber>
							</p:inputText>	
							</h:panelGrid>
						
						
						<p:toolbar >
				<f:facet name="right">
						 <p:commandButton value="Enregistrer" action="#{fraisLogementBean.enregistrer}" update="form">
						 	<p:confirm header="Confirmation" message="confirmez-vous l'enregistrement?"></p:confirm>
						 </p:commandButton>
						 
						 <p:commandButton value="Annuler" action="#{fraisLogementBean.annuler}" process="@this" update="form">
						 	<p:confirm header="Confirmation" message="confirmez-vous l'annulation?"></p:confirm>
						 </p:commandButton>
					</f:facet>
				</p:toolbar>

					
				
				<p:dataTable id="table"  var="tata"
						value="#{fraisLogementBean.listTypeLogementNationalite}" selection="#{fraisLogementBean.selectedTypeLogementNationalite}"
						rowKey="#{tata.idTypeLogNation}" emptyMessage="Aucun enregistrement">
						<f:facet name="header">LISTE DES FRAIS DE LOGEMENT</f:facet>
					<p:column headerText="Tpe logement" style="width:25%">#{tata.typeLogement.libtypeLogement}</p:column>
					<p:column headerText="Montant" style="width:20%">#{tata.montantTypeLogement}</p:column>
					<p:column headerText="Caution" style="width:40%">#{tata.cautionTypeLogement}</p:column>
					<p:column headerText="Année Scolaire" style="width:25%">#{tata.anneesScolaire.libAnneeScolaire}</p:column>
					<p:column headerText="Nationalité" style="width:20%">#{tata.typenationalite.libTypenationalite}</p:column>
			</p:dataTable>
			</div>
			
			<!-- Boite de confirmation -->
			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Oui" type="button"
					styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Non" type="button"
					styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>

</html>
